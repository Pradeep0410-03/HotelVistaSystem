name: Backend checks
on:
  pull_request:
    paths: ['backend/**', 'index.html', 'login.html', 'register.html', 'bookings.html', 'js/**', 'css/**', 'assets/optimized/**', 'tests/**', '.github/workflows/backend.yml']
  push:
    branches: [master]
    paths: ['backend/**', 'index.html', 'login.html', 'register.html', 'bookings.html', 'js/**', 'css/**', 'assets/optimized/**', 'tests/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hotelvista_test
          POSTGRES_USER: hotelvista_test
          POSTGRES_PASSWORD: disposable_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hotelvista_test -d hotelvista_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend logic and API client
        run: node --test tests/*.test.cjs
      - name: Compile and verify HTTP, Flyway and JPA behavior
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/hotelvista_test
          DB_USERNAME: hotelvista_test
          DB_PASSWORD: disposable_test_password
        run: mvn -B -ntp -Pintegration verify
